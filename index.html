<!DOCTYPE html>
<html>
<head>
    <title>My Chess Board</title>

    <style>
        body {
            background-color: #f5eee6;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #49352a;
            margin-top: 30px;
        }

        p {
            color: #6b5548;
            font-size: 18px;
        }

        table {
            border: 5px solid #49352a;
            border-collapse: collapse;
            margin: 30px auto;
        }

        td {
            width: 65px;
            height: 65px;
            text-align: center;
            vertical-align: middle;
            font-size: 42px;
        }

        /* Chess Board Colors */

        tr:nth-child(odd) td:nth-child(odd),
        tr:nth-child(even) td:nth-child(even) {
            background-color: black
        }

        tr:nth-child(odd) td:nth-child(even),
        tr:nth-child(even) td:nth-child(odd) {
            background-color:white
        }

        /* Black Pieces */

        tr:nth-child(-n+2) td {
            color: black
        }

        /* White Pieces */

        tr:nth-child(n+7) td {
            color: white;
            text-shadow: 1px 1px 3px black;
        }

    </style>
</head>

<body>

    <h1>♟ My Chess Board ♟</h1>

    <p>Welcome to the World of Chess!</p>

    <table>

        <!-- Row 1 -->
        <tr>
            <td>♜</td>
            <td>♞</td>
            <td>♝</td>
            <td>♛</td>
            <td>♚</td>
            <td>♝</td>
            <td>♞</td>
            <td>♜</td>
        </tr>

        <!-- Row 2 -->

            <td>♟</td>

            <td>♟</td>
            <td>♟</td>
        </tr>

        <!-- Row 3 -->
        <tr>
            <td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td>
        </tr>

        <!-- Row 4 -->
        <tr>
            <td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td>
        </tr>

        <!-- Row 5 -->
        <tr>
